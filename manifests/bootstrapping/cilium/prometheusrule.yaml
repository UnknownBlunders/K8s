---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-policy-drops
  namespace: kube-system
spec:
  groups:
    - name: cilium-policy.rules
      rules:
        - alert: CiliumPolicyDrop
          expr: |-
            sum by (source, destination, traffic_direction) (
              increase(hubble_drop_total{reason=~"POLICY_DENIED|POLICY_DENY"}[5m])
            ) > 0
          for: 0s
          annotations:
            summary: >-
              Cilium dropped {{ $value | humanize }} packets ({{ $labels.traffic_direction }}) from {{ $labels.source }} to {{ $labels.destination }} due to network policy
          labels:
            severity: warning
