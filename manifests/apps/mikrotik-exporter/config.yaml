apiVersion: v1
kind: ConfigMap
metadata:
  name: mikrotik-exporter-config
data:
  _mktxp.conf: |
    [MKTXP]
        listen = '0.0.0.0:49090'
        socket_timeout = 2
        verbose_mode = True

        initial_delay_on_failure = 120
        max_delay_on_failure = 900
        delay_inc_div = 5

        bandwidth = False
        bandwidth_test_dns_server = 8.8.8.8
        bandwidth_test_interval = 600
        minimal_collect_interval = 5

        http_server_threads = 16

        fetch_routers_in_parallel = True
        max_worker_threads = 5
        max_scrape_duration = 20
        total_max_scrape_duration = 30

        persistent_router_connection_pool = True
        persistent_dhcp_cache = True
        compact_default_conf_values = False
        prometheus_headers_deduplication = False

        probe_connection_pool = True
        probe_connection_pool_ttl = 300
        probe_connection_pool_max_size = 128
  mktxp.conf: |
    [default]
        enabled = True
        hostname = localhost
        username = username
        password = password
        credentials_file = ""
        ssl_ca_file = ""

        module_only = False
        remote_dhcp_entry = None
        remote_capsman_entry = None
        custom_labels = None

        port = 8729

        use_ssl = True
        no_ssl_certificate = False
        ssl_certificate_verify = False
        ssl_check_hostname = True
        plaintext_login = True

        health = True
        installed_packages = True
        dhcp = False
        dhcp_lease = False

        connections = True
        connection_stats = True

        interface = True

        route = True
        pool = True
        firewall = False
        neighbor = True
        address_list = None
        dns = True

        ipv6_route = False
        ipv6_pool = False
        ipv6_firewall = False
        ipv6_neighbor = False
        ipv6_address_list = None

        poe = False
        monitor = True
        netwatch = False
        public_ip = False
        wireless = False
        wireless_clients = False
        capsman = False
        capsman_clients = False
        w60g = False

        eoip = False
        gre = False
        ipip = False
        lte = False
        ipsec = False
        switch_port = True

        kid_control_assigned = False
        kid_control_dynamic = False

        user = True
        queue = True

        bfd = False
        bgp = False
        routing_stats = False
        certificate = True

        container = False

        interface_name_format = name
        check_for_updates = True

    [ROUTER]
        enabled = True
        hostname = router.blunders.me
        credentials_file = /mktxp_credentials/router-rb5009.yaml

        # Enable Router-specific metrics
        dhcp = True
        dhcp_lease = True
        route = True
        pool = True
        firewall = True
        neighbor = True
        address_list = None
        dns = True
        monitor = True
        netwatch = True
        public_ip = True
        wireless = False
        wireless_clients = False
        capsman = False
        capsman_clients = False

    [10G]
        enabled = True
        hostname = 10g.blunders.me
        credentials_file = /mktxp_credentials/10g-crs309.yaml

    [1GRACK]
        enabled = True
        hostname = 1g-rack.blunders.me
        credentials_file = /mktxp_credentials/1g-rack-crs326.yaml
