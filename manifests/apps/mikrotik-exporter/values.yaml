global:
  createDefaultServiceAccount: false
controllers:
  mktxp:
    type: deployment
    containers:
      mktxp:
        image:
          repository: ghcr.io/akpw/mktxp
          tag: 1.2.20
        command: ["mktxp"]
        args: ["--cfg-dir", "/mktxp_config", "export"]
        resources:
          requests:
            cpu: 20m
            memory: 300Mi
          limits:
            memory: 300Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  mktxp:
    ports:
      http:
        port: 49090
serviceMonitor:
  mktxp:
    serviceName: mikrotik-exporter
    endpoints:
      - port: http
        scheme: http
        path: /
        interval: 1m
        scrapeTimeout: 30s
persistence:
  config:
    type: configMap
    name: mikrotik-exporter-config
    globalMounts:
      - path: /mktxp_config/mktxp.conf
        subPath: mktxp.conf
      - path: /mktxp_config/_mktxp.conf
        subPath: _mktxp.conf
  credentials:
    type: secret
    name: mikrotik-exporter-credentials
    globalMounts:
      - path: /mktxp_credentials
