---
services:
  minecraft:
    type: LoadBalancer
    port: 25565
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.7.2
  extraServiceSpec:
    externalTrafficPolicy: Local
image:
  # renovate: datasource=github-releases depName=itzg/mc-router
  tag: "1.51.0"
  pullPolicy: IfNotPresent
podSecurityContext:
  runAsUser: 3000
  runAsGroup: 3000
  runAsNonRoot: true
  fsGroup: 2001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
resources:
  limits:
    cpu: 100m
    memory: 50Mi
  requests:
    cpu: 100m
    memory: 50Mi
