---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: abs
spec:
  endpointSelector:
    matchLabels:
      app: abs
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "13378"
              protocol: TCP
