---
name: check cloudflare ip ranges for updates
on:
  schedule:
    - cron: "0 14 1 * *" # 1st of every month
  workflow_dispatch:
jobs:
  update-cloudflare-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.COMMIT_PAT }}
      - name: Sync cloudflare ranges into firewall.tf
        run: |
          python3 .github/scripts/update_cloudflare_ips.py \
            tofu/router-rb5009/firewall.tf \
            --summary "${RUNNER_TEMP}/summary.md"

          {
            echo "Cloudflare's published IP ranges have changed. This updates the \`cloudflare\` address lists used to restrict the HTTP/HTTPS port forwards."
            echo ""
            echo "Sources: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6"
            echo ""
            cat "${RUNNER_TEMP}/summary.md"
          } > "${RUNNER_TEMP}/body.md"
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.COMMIT_PAT }}
          BRANCH: automation/cloudflare-ip-ranges
          TITLE: "router: update cloudflare ip ranges"
          FILE: tofu/router-rb5009/firewall.tf
        run: |
          if git diff --quiet -- "${FILE}"; then
            echo "Cloudflare ranges are up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "${BRANCH}"
          git add "${FILE}"
          git commit -m "${TITLE}"
          git push --force origin "${BRANCH}"

          EXISTING_PR=$(gh pr list --head "${BRANCH}" --state open --json number -q '.[0].number')
          if [ -n "${EXISTING_PR}" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
            gh pr edit "${EXISTING_PR}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body-file "${RUNNER_TEMP}/body.md"
          fi
